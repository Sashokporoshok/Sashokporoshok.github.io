<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniShelf - Your Universal Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .book-cover { box-shadow: 2px 4px 12px rgba(0,0,0,0.15); transition: transform 0.2s ease-in-out; }
        .book-cover:hover { transform: translateY(-4px); box-shadow: 2px 8px 16px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col h-full shadow-sm relative z-10 transition-all duration-300" id="sidebar">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-book-open-reader"></i> OmniShelf
            </h1>
            <p class="text-xs text-slate-400 mt-2 flex items-center gap-1">
                <i class="fa-solid fa-hard-drive text-indigo-400"></i> <span id="user-id-display">Local Storage Active</span>
            </p>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <ul class="space-y-1" id="nav-list">
                <!-- Search Nav Item -->
                <li>
                    <button onclick="setGlobalView('search')" id="nav-search" class="w-full text-left px-4 py-2.5 rounded-lg font-medium text-indigo-700 bg-indigo-50 flex items-center gap-3 transition-colors">
                        <i class="fa-solid fa-magnifying-glass w-5 text-center"></i> Find Books
                    </button>
                </li>
                
                <li class="pt-4 pb-2">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider px-4">My Shelves</div>
                </li>
                <!-- Dynamic Shelves Will Render Here -->
                <div id="shelves-container"></div>
            </ul>
        </div>

        <div class="p-4 border-t border-slate-100">
            <form id="add-shelf-form" class="flex gap-2">
                <input type="text" id="new-shelf-name" placeholder="New shelf name..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg transition-colors">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full relative bg-slate-50">
        
        <!-- Top Bar -->
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 sticky top-0 z-20 flex justify-between items-center h-16">
            <h2 id="view-title" class="text-xl font-bold text-slate-800">Find Books</h2>
            <!-- Mobile Sidebar Toggle -->
            <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar').classList.toggle('absolute')" class="md:hidden text-slate-500 hover:text-slate-700">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-6" id="main-scroll-area">
            
            <!-- Search View -->
            <div id="search-view" class="max-w-6xl mx-auto block">
                <form id="search-form" class="mb-8 relative max-w-2xl mx-auto">
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-search absolute left-4 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="Search by title, author, or language (e.g., 'Tolstoy Russian' or 'Odyssey Greek')..." 
                            class="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-lg">
                        <button type="submit" class="absolute right-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                            Search
                        </button>
                    </div>
                </form>

                <div id="search-loading" class="hidden text-center py-12">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500 mb-4"></i>
                    <p class="text-slate-500">Searching global libraries...</p>
                </div>

                <div id="search-results" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    <!-- Search Results will be injected here -->
                </div>
            </div>

            <!-- Shelf View -->
            <div id="shelf-view" class="max-w-6xl mx-auto hidden">
                <div id="shelf-empty-state" class="hidden text-center py-20">
                    <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fa-solid fa-book-open text-4xl text-slate-300"></i>
                    </div>
                    <h3 class="text-xl font-medium text-slate-700">This shelf is empty</h3>
                    <p class="text-slate-500 mt-2 mb-6">Go find some books to add here!</p>
                    <button onclick="setGlobalView('search')" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
                        Search Books
                    </button>
                </div>
                
                <div id="shelf-books" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    <!-- Shelf Books will be injected here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script>
        // --- APP STATE ---
        let state = {
            currentView: 'search', // 'search' or shelfId
            shelves: [],
            myBooks: [],
            searchResults: []
        };

        // --- LOCAL STORAGE HELPERS ---
        function loadData() {
            const data = localStorage.getItem('omnishelf_data');
            if (data) {
                const parsed = JSON.parse(data);
                state.shelves = parsed.shelves || [];
                state.myBooks = parsed.myBooks || [];
            } else {
                createDefaultShelves();
            }
        }

        function saveData() {
            localStorage.setItem('omnishelf_data', JSON.stringify({
                shelves: state.shelves,
                myBooks: state.myBooks
            }));
            renderSidebar();
            renderUI();
        }

        function createDefaultShelves() {
            state.shelves = [
                { id: 'want-to-read', name: 'Want to Read', createdAt: Date.now() },
                { id: 'read', name: 'Have Read', createdAt: Date.now() + 1 }
            ];
            saveData();
        }

        // Make functions globally available for inline HTML event handlers
        window.setGlobalView = (view) => {
            state.currentView = view;
            renderUI();
        };

        // Initialize App
        function initApp() {
            loadData();
            renderSidebar();
            renderUI();
        }

        // Add Shelf Handler
        document.getElementById('add-shelf-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('new-shelf-name');
            const name = input.value.trim();
            if (!name) return;

            const id = 'shelf_' + Date.now();
            state.shelves.push({ id, name, createdAt: Date.now() });
            saveData();
            input.value = '';
        });

        // Add / Move Book
        window.saveBookToShelf = (bookDataStr, shelfId) => {
            if (!shelfId) return; // if they selected the placeholder

            const bookData = JSON.parse(decodeURIComponent(bookDataStr));
            
            // Check if book exists
            const existingIndex = state.myBooks.findIndex(b => b.id === bookData.id);
            if (existingIndex >= 0) {
                state.myBooks[existingIndex].shelfId = shelfId;
                state.myBooks[existingIndex].updatedAt = Date.now();
            } else {
                state.myBooks.push({
                    ...bookData,
                    shelfId: shelfId,
                    dbId: bookData.id, // Keep dbId for compatibility with removeBook
                    updatedAt: Date.now()
                });
            }
            
            saveData();

            // Visual feedback
            const selectEl = document.getElementById(`select-${bookData.id}`);
            if(selectEl) {
                selectEl.classList.add('bg-green-100', 'text-green-800');
                setTimeout(() => {
                    selectEl.classList.remove('bg-green-100', 'text-green-800');
                }, 1000);
            }
        };

        // Remove Book
        window.removeBook = (dbId) => {
            state.myBooks = state.myBooks.filter(b => b.dbId !== dbId);
            saveData();
        };

        // Delete Shelf
        window.deleteShelf = (shelfId) => {
            if (confirm("Are you sure you want to delete this shelf? Books on this shelf will be removed.")) {
                state.myBooks = state.myBooks.filter(b => b.shelfId !== shelfId);
                state.shelves = state.shelves.filter(s => s.id !== shelfId);
                
                if(state.currentView === shelfId) {
                    state.currentView = 'search';
                }
                saveData();
            }
        };

        // --- SEARCH API (Google Books) ---
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            document.getElementById('search-results').innerHTML = '';
            document.getElementById('search-loading').classList.remove('hidden');

            try {
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=40`);
                const data = await response.json();
                
                state.searchResults = (data.items || []).map(item => ({
                    id: item.id,
                    title: item.volumeInfo.title || 'Unknown Title',
                    authors: item.volumeInfo.authors ? item.volumeInfo.authors.join(', ') : 'Unknown Author',
                    thumbnail: item.volumeInfo.imageLinks?.thumbnail?.replace('http:', 'https:') || null,
                    pageCount: item.volumeInfo.pageCount || null
                }));
                
                renderSearchResults();
            } catch (err) {
                console.error("Search API error:", err);
                document.getElementById('search-results').innerHTML = `<p class="col-span-full text-center text-red-500">Error fetching books. Try again.</p>`;
            } finally {
                document.getElementById('search-loading').classList.add('hidden');
            }
        });

        // --- RENDERING UI ---
        function renderSidebar() {
            const container = document.getElementById('shelves-container');
            container.innerHTML = '';

            // Sort shelves by createdAt
            const sortedShelves = [...state.shelves].sort((a, b) => a.createdAt - b.createdAt);

            sortedShelves.forEach(shelf => {
                const li = document.createElement('li');
                li.className = 'group relative';
                
                const isActive = state.currentView === shelf.id;
                const baseClasses = "w-full text-left px-4 py-2.5 rounded-lg font-medium flex items-center gap-3 transition-colors";
                const activeClasses = isActive ? "text-indigo-700 bg-indigo-50" : "text-slate-600 hover:bg-slate-100 hover:text-slate-900";
                
                // Get book count for this shelf
                const count = state.myBooks.filter(b => b.shelfId === shelf.id).length;

                li.innerHTML = `
                    <button onclick="setGlobalView('${shelf.id}')" class="${baseClasses} ${activeClasses}">
                        <i class="fa-solid fa-layer-group w-5 text-center text-slate-400 group-hover:text-indigo-500 ${isActive ? 'text-indigo-500' : ''}"></i> 
                        <span class="flex-1 truncate">${shelf.name}</span>
                        <span class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">${count}</span>
                    </button>
                    ${!['want-to-read', 'read'].includes(shelf.id) ? `
                        <button onclick="deleteShelf('${shelf.id}')" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-300 hover:text-red-500 hidden group-hover:block bg-white/80 p-1 rounded" title="Delete Shelf">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    ` : ''}
                `;
                container.appendChild(li);
            });

            // Update nav highlighting
            const searchBtn = document.getElementById('nav-search');
            if (state.currentView === 'search') {
                searchBtn.classList.add('text-indigo-700', 'bg-indigo-50');
                searchBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
            } else {
                searchBtn.classList.remove('text-indigo-700', 'bg-indigo-50');
                searchBtn.classList.add('text-slate-600', 'hover:bg-slate-100');
            }
        }

        function renderUI() {
            const searchView = document.getElementById('search-view');
            const shelfView = document.getElementById('shelf-view');
            const viewTitle = document.getElementById('view-title');

            if (state.currentView === 'search') {
                searchView.classList.remove('hidden');
                shelfView.classList.add('hidden');
                viewTitle.innerHTML = `<i class="fa-solid fa-earth-americas text-indigo-500 mr-2"></i> Global Library Search`;
                renderSearchResults();
            } else {
                searchView.classList.add('hidden');
                shelfView.classList.remove('hidden');
                
                const currentShelfObj = state.shelves.find(s => s.id === state.currentView);
                viewTitle.innerHTML = currentShelfObj ? `<i class="fa-solid fa-layer-group text-indigo-500 mr-2"></i> ${currentShelfObj.name}` : 'Shelf';
                
                renderShelfBooks();
            }
        }

        function renderSearchResults() {
            const container = document.getElementById('search-results');
            container.innerHTML = '';

            if (state.searchResults.length === 0) return;

            state.searchResults.forEach(book => {
                // Check if already in a shelf
                const savedBook = state.myBooks.find(b => b.id === book.id);
                container.appendChild(createBookCard(book, savedBook ? savedBook.shelfId : null));
            });
        }

        function renderShelfBooks() {
            const container = document.getElementById('shelf-books');
            const emptyState = document.getElementById('shelf-empty-state');
            container.innerHTML = '';

            const booksInShelf = state.myBooks.filter(b => b.shelfId === state.currentView);

            if (booksInShelf.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                booksInShelf.forEach(book => {
                    container.appendChild(createBookCard(book, state.currentView, true));
                });
            }
        }

        function createBookCard(book, currentShelfId, isShelfView = false) {
            const div = document.createElement('div');
            div.className = "bg-white rounded-xl overflow-hidden border border-slate-200 flex flex-col hover:border-indigo-300 transition-colors group";
            
            const coverImage = book.thumbnail 
                ? `<img src="${book.thumbnail}" alt="Cover" class="w-full h-48 object-cover book-cover">`
                : `<div class="w-full h-48 bg-slate-100 flex items-center justify-center text-slate-300"><i class="fa-solid fa-book text-4xl"></i></div>`;
            
            // Build Shelf Options
            let shelfOptions = `<option value="">+ Add to Shelf</option>`;
            if (isShelfView) {
                shelfOptions = `<option value="" disabled>Move to...</option>`;
            }
            
            state.shelves.forEach(s => {
                const selected = currentShelfId === s.id ? 'selected' : '';
                shelfOptions += `<option value="${s.id}" ${selected}>${s.name}</option>`;
            });

            // Need to pass book data safely to inline handler
            const safeBookData = encodeURIComponent(JSON.stringify(book));

            div.innerHTML = `
                <div class="relative overflow-hidden bg-slate-50 border-b border-slate-100 p-4 flex justify-center">
                    <div class="w-24 md:w-32">
                        ${coverImage}
                    </div>
                </div>
                <div class="p-4 flex flex-col flex-1">
                    <h3 class="font-bold text-slate-800 text-sm mb-1 line-clamp-2" title="${book.title}">${book.title}</h3>
                    <p class="text-xs text-slate-500 mb-3 truncate" title="${book.authors}">${book.authors}</p>
                    
                    <div class="mt-auto pt-3 border-t border-slate-100 flex items-center gap-2">
                        <select id="select-${book.id}" onchange="saveBookToShelf('${safeBookData}', this.value)" class="w-full text-xs bg-slate-50 border border-slate-200 rounded p-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer">
                            ${shelfOptions}
                        </select>
                        
                        ${isShelfView ? `
                            <button onclick="removeBook('${book.dbId}')" class="text-slate-400 hover:text-red-500 p-1.5 border border-transparent hover:bg-red-50 hover:border-red-100 rounded transition-colors" title="Remove from shelf">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
            return div;
        }

        // Boot the app
        initApp();
    </script>
</body>
</html>
