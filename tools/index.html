<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер подготовки к экзаменам</title>
    <!-- Подключаем Tailwind CSS для красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Подключаем шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
        }
        /* Стили для скроллбара внутри карточек */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c7c7cc; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa; 
        }
        /* Плавная анимация зачеркивания */
        .task-text {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen pb-12">

    <!-- Навигация / Шапка -->
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                    <span class="font-bold text-xl tracking-tight">ExamTracker</span>
                </div>
                <div class="text-indigo-100 text-sm hidden sm:block" id="today-date">
                    <!-- Сюда подставится сегодняшняя дата -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        
        <!-- Верхняя панель: Добавление нового экзамена и общая статистика -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100">
            <div class="flex flex-col md:flex-row gap-6 items-start md:items-center justify-between">
                
                <!-- Форма добавления -->
                <div class="w-full md:w-2/3 flex flex-col sm:flex-row gap-3">
                    <input type="text" id="new-exam-name" placeholder="Название предмета (напр. Математика)" 
                        class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 outline-none transition-all">
                    
                    <input type="date" id="new-exam-date" 
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 outline-none transition-all">
                    
                    <button id="add-exam-btn" class="text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-all shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Добавить план
                    </button>
                </div>

                <!-- Общий прогресс -->
                <div class="w-full md:w-1/3 bg-indigo-50 rounded-xl p-4 border border-indigo-100 flex flex-col justify-center">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-sm font-semibold text-indigo-900">Общий прогресс подготовки</span>
                        <span class="text-sm font-bold text-indigo-700" id="total-progress-text">0%</span>
                    </div>
                    <div class="w-full bg-indigo-200 rounded-full h-2.5">
                        <div id="total-progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Контейнер для карточек предметов -->
        <div id="exams-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Карточки будут генерироваться здесь через JavaScript -->
        </div>

    </main>

    <script>
        // --- ИНИЦИАЛИЗАЦИЯ ДАННЫХ ---
        // Пытаемся получить данные из localStorage, если их нет - создаем пустой массив
        let exams = JSON.parse(localStorage.getItem('exams')) || [];

        // --- УТИЛИТЫ ---
        // Сохранение в localStorage
        function saveExams() {
            localStorage.setItem('exams', JSON.stringify(exams));
            render();
        }

        // Генерация уникального ID
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // Форматирование даты
        function formatDate(dateString) {
            if (!dateString) return 'Дата не указана';
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('ru-RU', options);
        }

        // Расчет оставшихся дней
        function getDaysLeft(dateString) {
            if (!dateString) return null;
            const examDate = new Date(dateString);
            examDate.setHours(0,0,0,0);
            const today = new Date();
            today.setHours(0,0,0,0);
            const diffTime = Math.abs(examDate - today);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            
            if (examDate < today) return { text: 'Экзамен прошел', isPast: true };
            if (examDate.getTime() === today.getTime()) return { text: 'Экзамен СЕГОДНЯ!', isPast: false, urgent: true };
            
            // Склонение слова "день"
            let dayWord = 'дней';
            let lastDigit = diffDays % 10;
            let lastTwoDigits = diffDays % 100;
            
            if (lastDigit === 1 && lastTwoDigits !== 11) dayWord = 'день';
            else if ([2,3,4].includes(lastDigit) && ![12,13,14].includes(lastTwoDigits)) dayWord = 'дня';
            
            return { text: `Осталось: ${diffDays} ${dayWord}`, isPast: false, urgent: diffDays <= 7 };
        }

        // --- ЛОГИКА ПРИЛОЖЕНИЯ ---

        // Добавление нового предмета (экзамена)
        document.getElementById('add-exam-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('new-exam-name');
            const dateInput = document.getElementById('new-exam-date');
            
            const name = nameInput.value.trim();
            const date = dateInput.value;

            if (!name) {
                alert('Пожалуйста, введите название предмета!');
                return;
            }

            const newExam = {
                id: generateId(),
                title: name,
                date: date,
                tasks: []
            };

            exams.push(newExam);
            
            // Очищаем инпуты
            nameInput.value = '';
            dateInput.value = '';
            
            saveExams();
        });

        // Делегирование событий для динамически созданных элементов
        document.getElementById('exams-container').addEventListener('click', (e) => {
            // Удаление экзамена
            if (e.target.closest('.delete-exam-btn')) {
                if(confirm('Вы уверены, что хотите удалить этот предмет и все его задачи?')) {
                    const examId = e.target.closest('.delete-exam-btn').dataset.id;
                    exams = exams.filter(exam => exam.id !== examId);
                    saveExams();
                }
            }

            // Удаление задачи
            if (e.target.closest('.delete-task-btn')) {
                const examId = e.target.closest('.delete-task-btn').dataset.examId;
                const taskId = e.target.closest('.delete-task-btn').dataset.taskId;
                
                const exam = exams.find(e => e.id === examId);
                if (exam) {
                    exam.tasks = exam.tasks.filter(t => t.id !== taskId);
                    saveExams();
                }
            }

            // Добавление задачи
            if (e.target.closest('.add-task-btn')) {
                const examId = e.target.closest('.add-task-btn').dataset.id;
                const input = document.getElementById(`new-task-${examId}`);
                const taskText = input.value.trim();

                if (taskText) {
                    const exam = exams.find(e => e.id === examId);
                    exam.tasks.push({
                        id: generateId(),
                        text: taskText,
                        completed: false
                    });
                    input.value = '';
                    saveExams();
                }
            }
        });

        // Обработка нажатия Enter в поле ввода задачи
        document.getElementById('exams-container').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.classList.contains('task-input')) {
                const examId = e.target.dataset.id;
                const button = document.querySelector(`.add-task-btn[data-id="${examId}"]`);
                if(button) button.click();
            }
        });

        // Обработка чекбоксов (отметка выполнения)
        document.getElementById('exams-container').addEventListener('change', (e) => {
            if (e.target.classList.contains('task-checkbox')) {
                const examId = e.target.dataset.examId;
                const taskId = e.target.dataset.taskId;
                const isChecked = e.target.checked;

                const exam = exams.find(e => e.id === examId);
                if (exam) {
                    const task = exam.tasks.find(t => t.id === taskId);
                    if (task) {
                        task.completed = isChecked;
                        saveExams();
                    }
                }
            }
        });

        // --- РЕНДЕРИНГ ИНТЕРФЕЙСА ---
        function render() {
            const container = document.getElementById('exams-container');
            container.innerHTML = ''; // Очищаем контейнер

            let totalTasks = 0;
            let totalCompleted = 0;

            // Сортируем экзамены по дате (сначала ближайшие)
            const sortedExams = [...exams].sort((a, b) => {
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(a.date) - new Date(b.date);
            });

            if (sortedExams.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-16 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-300">
                        <i class="fa-solid fa-clipboard-list text-6xl mb-4 text-gray-200"></i>
                        <h3 class="text-xl font-medium text-gray-600 mb-2">У вас пока нет добавленных предметов</h3>
                        <p>Добавьте свой первый экзамен с помощью формы сверху, чтобы начать планирование.</p>
                    </div>
                `;
            }

            sortedExams.forEach(exam => {
                // Подсчет статистики для конкретного экзамена
                const examTotalTasks = exam.tasks.length;
                const examCompletedTasks = exam.tasks.filter(t => t.completed).length;
                const progressPercent = examTotalTasks === 0 ? 0 : Math.round((examCompletedTasks / examTotalTasks) * 100);
                
                // Для общей статистики
                totalTasks += examTotalTasks;
                totalCompleted += examCompletedTasks;

                // Информация о дедлайне
                let daysLeftHtml = '';
                if (exam.date) {
                    const daysInfo = getDaysLeft(exam.date);
                    let badgeClass = 'bg-blue-100 text-blue-800';
                    let iconClass = 'fa-calendar-day text-blue-500';
                    
                    if (daysInfo.isPast) {
                        badgeClass = 'bg-gray-100 text-gray-600';
                        iconClass = 'fa-calendar-check text-gray-500';
                    } else if (daysInfo.urgent) {
                        badgeClass = 'bg-red-100 text-red-800 border border-red-200 shadow-sm';
                        iconClass = 'fa-fire text-red-500';
                    } else {
                        badgeClass = 'bg-emerald-100 text-emerald-800';
                        iconClass = 'fa-clock text-emerald-500';
                    }

                    daysLeftHtml = `
                        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold ${badgeClass} mt-2">
                            <i class="fa-solid ${iconClass}"></i> ${daysInfo.text}
                        </div>
                    `;
                }

                // Генерация списка задач
                let tasksHtml = '';
                if (exam.tasks.length === 0) {
                    tasksHtml = `<div class="text-sm text-gray-400 italic py-2 text-center">План пока пуст. Добавьте задачи!</div>`;
                } else {
                    tasksHtml = exam.tasks.map(task => `
                        <li class="flex items-start gap-3 py-2 group hover:bg-gray-50 rounded-md px-2 -mx-2 transition-colors">
                            <div class="flex-shrink-0 pt-0.5">
                                <input type="checkbox" data-exam-id="${exam.id}" data-task-id="${task.id}" ${task.completed ? 'checked' : ''} 
                                    class="task-checkbox w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500 focus:ring-2 cursor-pointer transition-all">
                            </div>
                            <span class="text-sm flex-1 task-text break-words ${task.completed ? 'line-through text-gray-400' : 'text-gray-700'}">
                                ${task.text}
                            </span>
                            <button data-exam-id="${exam.id}" data-task-id="${task.id}" class="delete-task-btn text-gray-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 p-1">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </li>
                    `).join('');
                }

                // Цвета прогресс-бара
                let progressBarColor = 'bg-indigo-500';
                if (progressPercent === 100) progressBarColor = 'bg-emerald-500';
                else if (progressPercent > 0 && progressPercent < 30) progressBarColor = 'bg-orange-400';

                // Сборка карточки
                const cardHtml = `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-[420px] hover:shadow-md transition-shadow">
                        <!-- Шапка карточки -->
                        <div class="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-start relative">
                            <div class="pr-8 w-full">
                                <h2 class="text-xl font-bold text-gray-800 truncate" title="${exam.title}">${exam.title}</h2>
                                <div class="text-xs text-gray-500 mt-1 flex items-center gap-2">
                                    <i class="fa-regular fa-calendar"></i>
                                    ${formatDate(exam.date)}
                                </div>
                                ${daysLeftHtml}
                            </div>
                            <button data-id="${exam.id}" class="delete-exam-btn absolute top-4 right-4 text-gray-400 hover:text-red-600 transition-colors bg-white hover:bg-red-50 rounded-full w-8 h-8 flex items-center justify-center shadow-sm">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <!-- Прогресс -->
                        <div class="px-5 py-4 border-b border-gray-50">
                            <div class="flex justify-between items-center mb-1 text-xs font-medium">
                                <span class="text-gray-500">Пройдено тем: ${examCompletedTasks}/${examTotalTasks}</span>
                                <span class="${progressPercent === 100 ? 'text-emerald-600 font-bold' : 'text-indigo-600'}">${progressPercent}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="${progressBarColor} h-2 rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>

                        <!-- Список задач (скроллируемый) -->
                        <div class="p-5 flex-1 overflow-y-auto custom-scrollbar">
                            <ul class="space-y-1">
                                ${tasksHtml}
                            </ul>
                        </div>

                        <!-- Добавление задачи (Футер карточки) -->
                        <div class="p-4 bg-gray-50 border-t border-gray-100 flex gap-2">
                            <input type="text" id="new-task-${exam.id}" data-id="${exam.id}" placeholder="Что нужно изучить?" 
                                class="task-input flex-1 bg-white border border-gray-300 text-gray-900 text-xs rounded-md focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2 outline-none">
                            <button data-id="${exam.id}" class="add-task-btn bg-indigo-100 text-indigo-700 hover:bg-indigo-600 hover:text-white rounded-md px-3 py-2 transition-colors flex items-center justify-center">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            // Обновление общего прогресса в шапке
            const totalProgressPercent = totalTasks === 0 ? 0 : Math.round((totalCompleted / totalTasks) * 100);
            document.getElementById('total-progress-text').innerText = `${totalProgressPercent}%`;
            document.getElementById('total-progress-bar').style.width = `${totalProgressPercent}%`;
            
            // Если все выполнено
            if(totalTasks > 0 && totalProgressPercent === 100) {
                document.getElementById('total-progress-bar').classList.remove('bg-indigo-600');
                document.getElementById('total-progress-bar').classList.add('bg-emerald-500');
            } else {
                document.getElementById('total-progress-bar').classList.add('bg-indigo-600');
                document.getElementById('total-progress-bar').classList.remove('bg-emerald-500');
            }
        }

        // Установка сегодняшней даты в шапку
        const todayOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        let dateString = new Date().toLocaleDateString('ru-RU', todayOptions);
        dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1); // Заглавная буква
        document.getElementById('today-date').innerHTML = `<i class="fa-regular fa-clock mr-1"></i> Сегодня: ${dateString}`;

        // Первичный рендер при загрузке
        render();

    </script>
</body>
</html>
